# Tests of the Naaya packages, installed with pip as on the circa and destinet servers
name: tests

on:
  push:
    branches: [python3]
  pull_request:
    branches: [python3]
  workflow_dispatch:

jobs:
  test:
    name: test (${{ matrix.site }}, Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        site: [circa, destinet]
        python: ['3.12']
        include:
          - site: circa
            repo: eaudeweb/naaya.buildout.circabe
          - site: destinet
            repo: eaudeweb/naaya.buildout.destinet
    steps:
      - uses: actions/checkout@v7
        with:
          path: naaya

      # .gitmodules uses SSH URLs; only the DESTINET bundle is installed
      - name: Check out the DESTINET bundle
        run: |
          git config --global url."https://github.com/".insteadOf git@github.com:
          git -C naaya submodule update --init bundles/NaayaBundles-DESTINET

      - uses: actions/checkout@v7
        with:
          repository: ${{ matrix.repo }}
          ref: pip
          path: site

      - uses: actions/checkout@v7
        with:
          repository: eaudeweb/naaya.buildout.naaya
          ref: pip
          path: site/src/naaya.buildout.naaya

      # ubuntu-24.04 has Python 3.12; other versions come from setup-python
      - uses: actions/setup-python@v7
        if: matrix.python != '3.12'
        with:
          python-version: ${{ matrix.python }}

      # ffmpeg, pdftotext (poppler-utils) and Pango (WeasyPrint) are required on the servers
      - name: Install the python-ldap build dependencies, ffmpeg, poppler-utils and Pango
        # an Ubuntu mirror sometimes stalls: each attempt is limited to 5 minutes
        timeout-minutes: 16
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          for attempt in 1 2 3; do
            timeout 300 sudo -E apt-get -o Acquire::Retries=3 update &&
            timeout 300 sudo -E apt-get -o Acquire::Retries=3 -o DPkg::Lock::Timeout=120 install -y --no-install-recommends \
                libldap2-dev libsasl2-dev ffmpeg poppler-utils libpango-1.0-0 libpangoft2-1.0-0 &&
            exit 0
            echo "apt attempt $attempt failed"
          done
          exit 1

      - uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: pip-${{ matrix.site }}-${{ matrix.python }}-${{ hashFiles('site/versions.cfg', 'site/src/naaya.buildout.naaya/zope6-versions.cfg') }}
          restore-keys: pip-${{ matrix.site }}-${{ matrix.python }}-

      - name: Point the site at this checkout
        run: python${{ matrix.python }} naaya/.github/ci/prepare.py site naaya

      - name: Install
        working-directory: site
        run: make requirements packages config PYTHON=python${{ matrix.python }}

      - name: Test
        working-directory: site
        run: make test INSTANCE=ci TEST_ARGS=-v
