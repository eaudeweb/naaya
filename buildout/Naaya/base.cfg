# Sessions in the ZEO "temp" storage, shared by all ZEO clients
zodb-temporary-storage =
    <zodb_db temporary>
        mount-point /temp_folder
        cache-size 10000
        <zeoclient>
          server ${zeoserver:zeo-address}
          storage temp
          name zeo-temp-storage
          cache-size 100MB
        </zeoclient>
    </zodb_db>
zeo-conf-additional =
    %import tempstorage
    <temporarystorage temp>
        name temporary storage for sessioning
    </temporarystorage>
